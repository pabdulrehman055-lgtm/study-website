<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudyHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #1e293b;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        footer {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="notes.html">Notes</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">

        <h1>📩 Contact Us</h1>

        <div class="box">

            <p>If you have any questions or suggestions, contact us.</p>

            <form>
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Your Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Your Message</label>
                <textarea placeholder="Write your message"></textarea>

                <button type="submit">Send Message</button>
            </form>

        </div>

    </div>

    <footer>
        <p>© 2026 StudyHub</p>
    </footer>

</body>
</html>
